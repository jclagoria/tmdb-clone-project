server:
  port: 8080

spring:
  application:
    name: tmdb-backend

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      numeratorApi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 30
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s

  retry:
    instances:
      numeratorApi:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

  timelimiter:
    instances:
      numeratorApi:
        timeoutDuration: 10s

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

tmdb:
  base-url: ${TMDB_API_URL}
  access-token: ${TMDB_API_ACCESS_TOKEN}
