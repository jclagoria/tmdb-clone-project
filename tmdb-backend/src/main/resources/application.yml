server:
  port: 8080

spring:
  application:
    name: tmdb-backend

# Logging Configuration
logging:
  level:
    root: INFO
    com.api.tmdb: INFO
    reactor: WARN
    io.github.resilience4j: WARN
    org.springframework: WARN
  file:
    name: ./logs/tmdb-backend.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,ratelimiters
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      tmdbApi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 30
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s
      cloneApi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 30

  rateLimiter:
    instances:
      tmdbApi:
        registerHealthIndicator: true
        limitForPeriod: 40
        limitRefreshPeriod: 10s
        timeoutDuration: 0
      cloneApi:
        registerHealthIndicator: true
        limitForPeriod: 60
        limitRefreshPeriod: 10s
        timeoutDuration: 0

  retry:
    instances:
      tmdbApi:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - java.io.IOException

  timeLimiter:
    instances:
      tmdbApi:
        timeoutDuration: 10s

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

tmdb:
  base-url: ${TMDB_API_URL}
  access-token: ${TMDB_API_ACCESS_TOKEN}
  webclient:
    connect-timeout: 5s
    response-timeout: 10s
    pool:
      max-connections: 50
      pending-acquire-timeout: 10s
